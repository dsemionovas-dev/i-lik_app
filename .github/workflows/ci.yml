# Kiekvienam push ir PR: analizė + visi testai.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Priklausomybės
        run: flutter pub get

      - name: Formatas (tik įspėjimas)
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Kodas nesuformatuotas – paleiskite dart format lib test"

      - name: Analizė
        run: flutter analyze

      - name: Testai
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
