name: islik
description: "Išlik – žaidybiškas išgyvenimo, navigacijos ir pilietinio saugumo įgūdžių mokymasis."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  go_router: ^18.1.0
  supabase_flutter: ^2.18.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/lessons/
    - assets/guide/
    - assets/badges.json

# Piktogramos ir užsklanda generuojamos iš assets/branding/ (pakeitus PNG – paleisti iš naujo):
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#2E7D32"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#2E7D32"
    image: assets/branding/splash_logo.png
  web: false
